<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurtleClicker</title>
    
    <!-- TAB ICON -->
    <link rel="icon" type="image/png" href="Untitled.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark-green: #064e3b;
            --mid-green: #14532d;
            --bright-green: #22c55e;
            --lime: #a3e635;
            --white: #f8fafc;
            --gold: #facc15;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Luckiest Guy', cursive;
            background-color: var(--dark-green);
            color: var(--white); overflow: hidden;
        }

        #home-menu {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle, var(--mid-green) 0%, var(--dark-green) 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 500; border: 15px solid var(--mid-green); box-sizing: border-box;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .dot {
            position: absolute; background: var(--bright-green);
            border-radius: 50%; opacity: 0.3; pointer-events: none;
            animation: float 8s infinite linear;
        }

        @keyframes float {
            from { transform: translateY(110vh); }
            to { transform: translateY(-10vh); }
        }

        .particle {
            position: absolute; pointer-events: none;
            color: var(--lime); font-size: 28px; font-weight: bold;
            animation: rise 0.8s ease-out forwards; z-index: 100;
            text-shadow: 2px 2px 0px #000;
        }

        @keyframes rise {
            to { transform: translateY(-120px) scale(1.2); opacity: 0; }
        }

        #game-screen {
            display: grid; width: 100vw; height: 100vh;
            grid-template-columns: 320px 1fr 320px;
            background: #022c22;
        }

        .sidebar { background: rgba(0,0,0,0.4); padding: 25px; border: 4px solid var(--mid-green); backdrop-filter: blur(5px); z-index: 10; }

        .green-btn {
            padding: 15px 40px; font-size: 24px; font-family: 'Luckiest Guy';
            background: var(--bright-green); color: white;
            border: 4px solid var(--white); border-radius: 50px;
            cursor: pointer; box-shadow: 0 6px 0 var(--dark-green);
        }
        .green-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 var(--dark-green); }

        .music-btn { padding: 10px 20px; font-size: 16px; margin: 0 5px; background: #059669; border-radius: 20px; }

        /* FIXED CLICKABLE AREA */
        #turtle-wrapper {
            position: relative; width: 500px; height: 500px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 5;
        }

        #turtle-container {
            width: 100%; height: 100%;
            transition: transform 0.05s ease;
            display: flex; align-items: center; justify-content: center;
            pointer-events: none; /* Let the wrapper handle the clicks */
        }
        #turtle-wrapper:active #turtle-container { transform: scale(0.92); }

        #turtle-img { width: 100%; height: 100%; object-fit: contain; }

        .stat-display { font-size: 80px; color: var(--lime); text-shadow: 5px 5px 0px #000; margin: 0; }

        .item {
            background: var(--mid-green); padding: 15px; margin-bottom: 15px;
            border-radius: 15px; border: 3px solid var(--bright-green);
            cursor: pointer; display: none;
        }
        .item.unlocked { display: block; }
    </style>
</head>
<body>

<audio id="bg-music" src="music.mp3" loop></audio>
<audio id="click-sfx" src="click.mp3"></audio>

<div id="home-menu">
    <h1 style="font-size: 100px; color: var(--lime); text-shadow: 6px 6px 0px #000;">TurtleClicker</h1>
    <button class="green-btn" onclick="goTo('game')">START GAME</button>
</div>

<div id="game-screen">
    <div class="sidebar">
        <h2 style="color:var(--lime); text-align:center;">UPGRADES</h2>
        <div class="item unlocked" onclick="buy('click')">🥬 ORGANIC LETTUCE<br>Cost: <span id="c-cost">10</span></div>
        <div class="item unlocked" onclick="buy('passive')">☀️ UV LIGHT<br>Cost: <span id="p-cost">50</span></div>
        <div class="item" id="upg-auto" onclick="buy('auto')">🐢 TURTLE FRIEND<br>Cost: <span id="a-cost">2000</span></div>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative;">
        <button class="green-btn" style="position: absolute; top: 20px; right: 20px; padding: 10px 20px; font-size: 14px;" onclick="goTo('menu')">HOME</button>
        
        <div class="stat-display" id="v-count">0</div>
        <div id="next-evo-tracker" style="color:var(--lime); margin-bottom:10px;">Next Evo: <span id="clicks-left">50</span></div>

        <div id="turtle-wrapper" onclick="handleTurtleClick(event)">
            <div id="turtle-container">
                <div id="turtle-art" style="width:100%; height:100%;"></div>
            </div>
        </div>
        
        <div style="font-size: 28px; color: var(--bright-green); margin-top: 20px;" id="stage-name">Character: Egg</div>
    </div>

    <div class="sidebar">
        <h2 style="color:var(--lime); text-align:center;">STATS</h2>
        <p>TOTAL AGE: <span id="age-num">0</span></p>
        <p>V/SEC: <span id="vps">0</span></p>
        <hr border="1" color="#14532d">
        
        <h3 style="color:var(--lime); text-align:center; margin-top:20px;">Music Control</h3>
        <div style="display:flex; justify-content:center; gap:10px;">
            <button class="green-btn music-btn" onclick="controlMusic('pause')">Pause</button>
            <button class="green-btn music-btn" onclick="controlMusic('play')">Play</button>
        </div>
    </div>
</div>

<script>
    let vitality = 0;
    let clickPower = 1;
    let passivePower = 0;
    let currentStage = 0;
    let costs = { click: 10, passive: 50, auto: 2000 };

    const characterData = [
        { name: "Egg", goal: 0, type: 'svg', art: `<svg viewBox="0 0 100 100"><ellipse cx="50" cy="50" rx="30" ry="40" fill="#fefce8" stroke="#ccc" stroke-width="2"/><path d="M40 30 Q50 20 60 30" fill="none" stroke="#ddd" stroke-width="1"/></svg>` },
        { name: "Hatchling", goal: 50, type: 'img', art: `Untitled.png` },
        { name: "Armor Shell", goal: 2500, type: 'svg', art: `<svg viewBox="0 0 100 100"><path d="M20 60 Q50 10 80 60" fill="#14532d" stroke="#facc15" stroke-width="4"/><rect x="40" y="60" width="20" height="15" fill="#166534"/><circle cx="85" cy="55" r="12" fill="#166534" stroke="#facc15" stroke-width="2"/></svg>` },
        { name: "Ancient Titan", goal: 15000, type: 'svg', art: `<svg viewBox="0 0 100 100"><path d="M10 70 Q50 -10 90 70 Z" fill="#064e3b" stroke="#fbbf24" stroke-width="5"/><circle cx="50" cy="40" r="15" fill="none" stroke="#fbbf24" opacity="0.3"/><circle cx="92" cy="65" r="18" fill="#064e3b" stroke="#fbbf24" stroke-width="3"/></svg>` }
    ];

    function handleTurtleClick(e) {
        vitality += clickPower;
        
        const p = document.createElement('div');
        p.className = 'particle';
        p.innerText = "+" + clickPower;
        p.style.left = e.clientX + 'px';
        p.style.top = e.clientY + 'px';
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 800);

        document.getElementById('click-sfx').currentTime = 0;
        document.getElementById('click-sfx').play().catch(() => {});
        update();
    }

    function buy(type) {
        if(vitality >= costs[type]) {
            vitality -= costs[type];
            if(type === 'click') { clickPower += 2; costs.click *= 1.8; }
            else if(type === 'passive') { passivePower += 1; costs.passive *= 2; }
            else { passivePower += 20; costs.auto *= 2.5; }
            update();
        }
    }

    function update() {
        document.getElementById('v-count').innerText = Math.floor(vitality).toLocaleString();
        document.getElementById('vps').innerText = passivePower;
        document.getElementById('age-num').innerText = Math.floor(vitality/100);
        document.getElementById('c-cost').innerText = Math.floor(costs.click);
        document.getElementById('p-cost').innerText = Math.floor(costs.passive);
        document.getElementById('a-cost').innerText = Math.floor(costs.auto);

        if(vitality >= 1500) document.getElementById('upg-auto').classList.add('unlocked');

        for(let i=characterData.length-1; i>=0; i--) {
            if(vitality >= characterData[i].goal) { 
                currentStage = i; 
                break; 
            }
        }

        let tracker = document.getElementById('next-evo-tracker');
        if(currentStage < characterData.length - 1) {
            let needed = characterData[currentStage + 1].goal - Math.floor(vitality);
            document.getElementById('clicks-left').innerText = Math.ceil(needed / clickPower);
            tracker.style.display = "block";
        } else {
            tracker.innerText = "MAX EVOLUTION"; 
        }

        const artDiv = document.getElementById('turtle-art');
        const char = characterData[currentStage];
        if(char.type === 'img') {
            artDiv.innerHTML = `<img src="${char.art}" id="turtle-img">`;
        } else {
            artDiv.innerHTML = char.art;
        }
        document.getElementById('stage-name').innerText = "Character: " + char.name;
    }

    function goTo(scr) {
        document.getElementById('home-menu').style.transform = (scr === 'game') ? 'translateY(-100%)' : 'translateY(0)';
        if(scr === 'game') document.getElementById('bg-music').play().catch(() => {});
    }

    function controlMusic(action) {
        const music = document.getElementById('bg-music');
        action === 'play' ? music.play() : music.pause();
    }

    setInterval(() => { if(passivePower > 0) { vitality += (passivePower / 10); update(); } }, 100);
    update();
</script>
</body>
</html>
