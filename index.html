<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurtleClicker</title>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark-green: #064e3b;
            --mid-green: #14532d;
            --bright-green: #22c55e;
            --lime: #a3e635;
            --white: #f8fafc;
            --gold: #facc15;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Luckiest Guy', cursive;
            background-color: var(--dark-green);
            color: var(--white); overflow: hidden;
        }

        /* --- HOME MENU & DOTS --- */
        #home-menu {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle, var(--mid-green) 0%, var(--dark-green) 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 500; border: 15px solid var(--mid-green); box-sizing: border-box;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .dot {
            position: absolute; background: var(--bright-green);
            border-radius: 50%; opacity: 0.3; pointer-events: none;
            animation: float 8s infinite linear;
        }

        @keyframes float {
            from { transform: translateY(110vh); }
            to { transform: translateY(-10vh); }
        }

        /* --- CLICK PARTICLES --- */
        .particle {
            position: absolute; pointer-events: none;
            color: var(--lime); font-size: 24px; font-weight: bold;
            animation: rise 0.8s ease-out forwards; z-index: 100;
        }

        @keyframes rise {
            to { transform: translateY(-100px); opacity: 0; }
        }

        /* --- GOLDEN CLOVER --- */
        #clover {
            position: absolute; width: 60px; height: 60px;
            background: var(--gold); border-radius: 10px;
            display: none; cursor: pointer; z-index: 80;
            box-shadow: 0 0 20px var(--gold);
            animation: pulse 1s infinite alternate;
            display: flex; align-items: center; justify-content: center; font-size: 30px;
        }

        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.2); } }

        /* --- LAYOUT --- */
        #game-screen {
            display: grid; width: 100vw; height: 100vh;
            grid-template-columns: 320px 1fr 320px;
            background: #022c22;
        }

        .sidebar { background: rgba(0,0,0,0.4); padding: 25px; border: 4px solid var(--mid-green); backdrop-filter: blur(5px); }

        .green-btn {
            padding: 15px 40px; font-size: 24px; font-family: 'Luckiest Guy';
            background: var(--bright-green); color: white;
            border: 4px solid var(--white); border-radius: 50px;
            cursor: pointer; box-shadow: 0 6px 0 var(--dark-green);
            z-index: 10;
        }
        .green-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 var(--dark-green); }

        #turtle-container {
            width: 450px; height: 450px; cursor: pointer;
            transition: transform 0.05s ease; position: relative;
        }
        #turtle-container:active { transform: scale(0.92); }

        .stat-display { font-size: 80px; color: var(--lime); text-shadow: 5px 5px 0px #000; margin: 0; }
        
        #multiplier-tag {
            color: var(--gold); font-size: 20px; display: none;
            background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 20px;
        }

        .item {
            background: var(--mid-green); padding: 15px; margin-bottom: 15px;
            border-radius: 15px; border: 3px solid var(--bright-green);
            cursor: pointer; display: none;
        }
        .item.unlocked { display: block; }
    </style>
</head>
<body>

<audio id="bg-music" src="music.mp3" loop></audio>
<audio id="click-sfx" src="click.mp3" preload="auto"></audio>

<div id="home-menu">
    <h1 style="font-size: 100px; color: var(--lime); text-shadow: 6px 6px 0px #000;">TurtleClicker</h1>
    <div class="btn-group" style="display:flex; flex-direction:column; gap:15px; align-items:center;">
        <button class="green-btn" onclick="goTo('game')">START GAME</button>
        <button class="green-btn" style="font-size: 18px;" onclick="toggleCodes()">CODES</button>
        <div id="code-section" style="display:none;">
            <input type="text" id="code-in" style="padding:10px; border-radius:10px; border:none; text-align:center;" placeholder="CODE">
            <button class="green-btn" style="padding:5px 15px; font-size:16px;" onclick="checkCode()">OK</button>
        </div>
        <button id="admin-btn" class="green-btn" style="display:none; border-color:var(--gold);" onclick="goTo('owner')">OWNER MENU</button>
    </div>
</div>

<div id="game-screen">
    <div id="clover" onclick="activateClover()">🍀</div>

    <div class="sidebar">
        <h2 style="color:var(--lime); text-align:center;">UPGRADES</h2>
        <div class="item unlocked" onclick="buy('click')">🥬 ORGANIC LETTUCE<br>Cost: <span id="c-cost">10</span></div>
        <div class="item unlocked" onclick="buy('passive')">☀️ UV LIGHT<br>Cost: <span id="p-cost">50</span></div>
        <div class="item" id="upg-auto" onclick="buy('auto')">🐢 TURTLE FRIEND<br>Cost: <span id="a-cost">2000</span></div>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative;">
        <button class="green-btn" style="position: absolute; top: 20px; right: 20px; padding: 10px 20px; font-size: 14px;" onclick="goTo('menu')">HOME</button>
        
        <div id="multiplier-tag">2X BOOST ACTIVE!</div>
        <div class="stat-display" id="v-count">0</div>
        <div id="next-evo-tracker" style="color:var(--lime); margin-bottom:10px;">Next Evo: <span id="clicks-left">50</span></div>

        <div id="turtle-container" onclick="handleTurtleClick(event)">
            <div id="turtle-art"></div>
        </div>
        
        <div style="font-size: 28px; color: var(--bright-green); margin-top: 20px;" id="stage-name">Character: Egg</div>
    </div>

    <div class="sidebar">
        <h2 style="color:var(--lime); text-align:center;">STATS</h2>
        <p>TOTAL AGE: <span id="age-num">0</span></p>
        <p>V/SEC: <span id="vps">0</span></p>
        <hr border="1" color="#14532d">
        <p style="font-size:14px; opacity:0.7;">Tip: Catch the Lucky Clover for 2x gains!</p>
    </div>
</div>

<!-- Admin Tab -->
<div id="owner-tab" style="position:fixed; top:0; left:100%; width:100vw; height:100vh; background:#022c22; z-index:600; display:flex; flex-direction:column; align-items:center; justify-content:center; transition:0.5s;">
    <h1>ADMIN MODS</h1>
    <button class="green-btn" onclick="vitality += 500000; update();">GIVE 500K</button><br>
    <button class="green-btn" style="background:#b91c1c" onclick="goTo('menu')">CLOSE</button>
</div>

<script>
    let vitality = 0;
    let clickPower = 1;
    let passivePower = 0;
    let multiplier = 1;
    let currentStage = 0;
    let costs = { click: 10, passive: 50, auto: 2000 };

    const characterData = [
        { name: "Egg", goal: 0, art: `<svg viewBox="0 0 100 100"><ellipse cx="50" cy="50" rx="30" ry="40" fill="#fefce8" stroke="#ccc"/></svg>` },
        { name: "Hatchling", goal: 50, art: `<svg viewBox="0 0 100 100"><path d="M20 70 L10 85 M80 70 L90 85" stroke="#166534" stroke-width="6"/><circle cx="50" cy="50" r="30" fill="#22c55e"/><circle cx="82" cy="50" r="10" fill="#22c55e"/></svg>` },
        { name: "Snapper", goal: 1000, art: `<svg viewBox="0 0 100 100"><path d="M15 50 Q50 0 85 50 Q50 100 15 50" fill="#15803d" stroke="#facc15" stroke-width="3"/><circle cx="90" cy="50" r="14" fill="#15803d"/></svg>` },
        { name: "Ancient One", goal: 10000, art: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#065f46" stroke="#fbbf24" stroke-width="5"/><circle cx="95" cy="50" r="18" fill="#065f46"/></svg>` }
    ];

    function createDots() {
        const menu = document.getElementById('home-menu');
        for(let i=0; i<40; i++) {
            let d = document.createElement('div'); d.className = 'dot';
            d.style.width = d.style.height = Math.random()*12+4+'px';
            d.style.left = Math.random()*100+'vw'; d.style.animationDelay = Math.random()*8+'s';
            menu.appendChild(d);
        }
    }

    function handleTurtleClick(e) {
        let gain = clickPower * multiplier;
        vitality += gain;
        
        // Spawn text particle at mouse location
        const p = document.createElement('div');
        p.className = 'particle';
        p.innerText = "+" + gain;
        p.style.left = e.clientX + 'px';
        p.style.top = e.clientY + 'px';
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 800);

        document.getElementById('click-sfx').currentTime = 0;
        document.getElementById('click-sfx').play();
        update();
    }

    function spawnClover() {
        const c = document.getElementById('clover');
        c.style.display = 'flex';
        c.style.left = Math.random()*80 + 'vw';
        c.style.top = Math.random()*80 + 'vh';
        setTimeout(() => c.style.display = 'none', 5000);
    }

    function activateClover() {
        multiplier = 2;
        document.getElementById('multiplier-tag').style.display = 'block';
        document.getElementById('clover').style.display = 'none';
        setTimeout(() => {
            multiplier = 1;
            document.getElementById('multiplier-tag').style.display = 'none';
        }, 30000);
    }

    function buy(type) {
        if(vitality >= costs[type]) {
            vitality -= costs[type];
            if(type === 'click') { clickPower += 2; costs.click *= 1.8; }
            else if(type === 'passive') { passivePower += 1; costs.passive *= 2; }
            else { passivePower += 20; costs.auto *= 2.5; }
            update();
        }
    }

    function update() {
        document.getElementById('v-count').innerText = Math.floor(vitality).toLocaleString();
        document.getElementById('vps').innerText = passivePower;
        document.getElementById('age-num').innerText = Math.floor(vitality/100);
        document.getElementById('c-cost').innerText = Math.floor(costs.click);
        document.getElementById('p-cost').innerText = Math.floor(costs.passive);
        document.getElementById('a-cost').innerText = Math.floor(costs.auto);

        if(vitality >= 1500) document.getElementById('upg-auto').classList.add('unlocked');

        for(let i=characterData.length-1; i>=0; i--) {
            if(vitality >= characterData[i].goal) { currentStage = i; break; }
        }

        if(currentStage < characterData.length-1) {
            document.getElementById('clicks-left').innerText = characterData[currentStage+1].goal - Math.floor(vitality);
        } else {
            document.getElementById('next-evo-tracker').innerText = "MAX FORM REACHED";
        }

        document.getElementById('turtle-art').innerHTML = characterData[currentStage].art;
        document.getElementById('stage-name').innerText = "Character: " + characterData[currentStage].name;
    }

    function goTo(scr) {
        document.getElementById('home-menu').style.transform = (scr === 'game' || scr === 'owner') ? 'translateY(-100%)' : 'translateY(0)';
        document.getElementById('owner-tab').style.left = (scr === 'owner') ? '0' : '100%';
    }

    function toggleCodes() {
        const s = document.getElementById('code-section');
        s.style.display = (s.style.display === 'block') ? 'none' : 'block';
    }

    function checkCode() {
        if(document.getElementById('code-in').value.toUpperCase() === "OWNER123") {
            document.getElementById('admin-btn').style.display = 'block';
            toggleCodes();
        }
    }

    createDots();
    setInterval(spawnClover, 45000); // Clover every 45 seconds
    setInterval(() => { if(passivePower > 0) { vitality += (passivePower / 10) * multiplier; update(); } }, 100);
    update();
</script>
</body>
</html>
