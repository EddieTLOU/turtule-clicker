<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TurtleClicker</title>
    
    <!-- TAB ICON -->
    <link rel="icon" type="image/png" href="Untitled.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark-green: #064e3b;
            --mid-green: #14532d;
            --bright-green: #22c55e;
            --lime: #a3e635;
            --white: #f8fafc;
            --gold: #facc15;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Luckiest Guy', cursive;
            background-color: var(--dark-green);
            color: var(--white); overflow: hidden;
            touch-action: manipulation;
        }

        /* --- MOBILE ADAPTIVE MENU --- */
        #home-menu {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, var(--mid-green) 0%, var(--dark-green) 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 500; transition: transform 0.5s ease-in-out;
            text-align: center;
        }

        .btn-stack { display: flex; flex-direction: column; gap: 10px; width: 80%; max-width: 300px; }

        /* --- GAME LAYOUT --- */
        #game-screen {
            display: flex; flex-direction: column; 
            width: 100vw; height: 100vh;
            background: #022c22;
        }

        .header-stats {
            background: rgba(0,0,0,0.5); padding: 10px;
            display: flex; justify-content: space-around; align-items: center;
            border-bottom: 3px solid var(--mid-green);
        }

        .main-area {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            position: relative; overflow: hidden;
        }

        .bottom-shop {
            height: 30%; background: rgba(0,0,0,0.6);
            border-top: 4px solid var(--mid-green);
            display: flex; flex-direction: column; padding: 10px;
            overflow-y: auto;
        }

        /* --- INTERACTIVE BUTTONS --- */
        .green-btn {
            padding: 12px 20px; font-size: 18px; font-family: 'Luckiest Guy';
            background: var(--bright-green); color: white;
            border: 3px solid var(--white); border-radius: 25px;
            cursor: pointer; box-shadow: 0 4px 0 var(--dark-green);
            transition: transform 0.1s;
        }
        .green-btn:active { transform: scale(0.95) translateY(2px); box-shadow: 0 2px 0 var(--dark-green); }

        .code-input {
            padding: 10px; border-radius: 15px; border: none; 
            text-align: center; font-family: 'Luckiest Guy'; width: 100%;
        }

        /* --- TURTLE ACTION --- */
        #turtle-wrapper {
            width: 280px; height: 280px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; position: relative;
        }

        #turtle-container { width: 100%; height: 100%; transition: transform 0.05s; }
        #turtle-wrapper:active #turtle-container { transform: scale(0.85); }

        .particle {
            position: absolute; pointer-events: none;
            color: var(--lime); font-size: 32px;
            animation: float-up 0.6s ease-out forwards;
            text-shadow: 2px 2px 0 #000; z-index: 100;
        }

        @keyframes float-up { to { transform: translateY(-100px); opacity: 0; } }

        .stat-main { font-size: 45px; color: var(--lime); text-shadow: 3px 3px 0 #000; }

        .shop-item {
            display: none; background: var(--mid-green); padding: 10px;
            margin-bottom: 8px; border-radius: 15px; border: 2px solid var(--bright-green);
            justify-content: space-between; align-items: center;
        }
        .shop-item.unlocked { display: flex; }

        /* Admin/Owner Panel */
        #owner-tab {
            position: fixed; top: 0; right: -100%; width: 100%; height: 100%;
            background: var(--dark-green); z-index: 600; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: 0.4s;
        }
    </style>
</head>
<body>

<audio id="bg-music" src="music.mp3" loop></audio>
<audio id="click-sfx" src="click.mp3"></audio>

<div id="home-menu">
    <h1 style="font-size: 50px; color: var(--lime); margin-bottom: 20px;">TurtleClicker</h1>
    <div class="btn-stack">
        <button class="green-btn" onclick="goTo('game')">PLAY</button>
        <button class="green-btn" style="font-size: 14px;" onclick="toggleCodes()">CODES</button>
        <div id="code-box" style="display:none;">
            <input type="text" id="code-in" class="code-input" placeholder="ENTER CODE">
            <button class="green-btn" style="width: 100%; margin-top:5px; padding:5px;" onclick="checkCode()">OK</button>
        </div>
        <button id="admin-entry" class="green-btn" style="display:none; border-color:var(--gold);" onclick="goTo('owner')">OWNER MENU</button>
    </div>
</div>

<div id="game-screen">
    <div class="header-stats">
        <div>V/SEC: <span id="vps">0</span></div>
        <div>AGE: <span id="age-num">0</span></div>
        <button class="green-btn" style="padding: 5px 15px; font-size: 12px;" onclick="goTo('menu')">MENU</button>
    </div>

    <div class="main-area">
        <div class="stat-main" id="v-count">0</div>
        <div id="evo-text" style="color:var(--lime); font-size: 14px;">Next: <span id="clicks-left">50</span></div>

        <div id="turtle-wrapper" onclick="handleTurtleClick(event)">
            <div id="turtle-container">
                <div id="turtle-art" style="width:100%; height:100%;"></div>
            </div>
        </div>
        
        <div id="stage-name" style="color:var(--bright-green); margin-top:10px;">Egg</div>
        
        <div style="margin-top: 15px;">
            <button class="green-btn" style="padding:8px 15px; font-size:14px; background:#059669;" onclick="music('play')">♫ PLAY</button>
            <button class="green-btn" style="padding:8px 15px; font-size:14px; background:#059669;" onclick="music('pause')">║ PAUSE</button>
        </div>
    </div>

    <div class="bottom-shop">
        <h3 style="margin: 0 0 10px 0; text-align:center; color:var(--lime);">UPGRADES</h3>
        <div class="shop-item unlocked" onclick="buy('click')">
            <span>LETTUCE</span>
            <span class="green-btn" style="padding:5px 10px; font-size:14px;">$<span id="c-cost">10</span></span>
        </div>
        <div class="shop-item unlocked" onclick="buy('passive')">
            <span>UV LIGHT</span>
            <span class="green-btn" style="padding:5px 10px; font-size:14px;">$<span id="p-cost">50</span></span>
        </div>
        <div class="shop-item" id="upg-auto" onclick="buy('auto')">
            <span>FRIEND</span>
            <span class="green-btn" style="padding:5px 10px; font-size:14px;">$<span id="a-cost">2000</span></span>
        </div>
    </div>
</div>

<div id="owner-tab">
    <h1>OWNER MODS</h1>
    <button class="green-btn" onclick="vitality += 1000000; update();">ADD 1M VITALITY</button>
    <br>
    <button class="green-btn" style="background:#b91c1c" onclick="goTo('game')">EXIT</button>
</div>

<script>
    let vitality = 0;
    let clickPower = 1;
    let passivePower = 0;
    let currentStage = 0;
    let costs = { click: 10, passive: 50, auto: 2000 };

    const characterData = [
        { name: "Egg", goal: 0, type: 'svg', art: `<svg viewBox="0 0 100 100"><ellipse cx="50" cy="55" rx="30" ry="38" fill="#fefce8" stroke="#ccc" stroke-width="2"/></svg>` },
        { name: "Hatchling", goal: 50, type: 'img', art: `Untitled.png` },
        { name: "Iron Shell", goal: 5000, type: 'svg', art: `<svg viewBox="0 0 100 100"><path d="M20 70 Q50 10 80 70" fill="#14532d" stroke="#facc15" stroke-width="4"/><circle cx="85" cy="65" r="12" fill="#166534" stroke="#facc15" stroke-width="2"/></svg>` },
        { name: "God Turtle", goal: 50000, type: 'svg', art: `<svg viewBox="0 0 100 100"><path d="M10 75 Q50 -10 90 75 Z" fill="#064e3b" stroke="#fbbf24" stroke-width="5"/><circle cx="92" cy="70" r="18" fill="#064e3b" stroke="#fbbf24" stroke-width="3"/></svg>` }
    ];

    function handleTurtleClick(e) {
        vitality += clickPower;
        
        // Mobile particle support
        const p = document.createElement('div');
        p.className = 'particle';
        p.innerText = "+" + clickPower;
        p.style.left = (e.clientX || e.touches[0].clientX) + 'px';
        p.style.top = (e.clientY || e.touches[0].clientY) + 'px';
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 600);

        document.getElementById('click-sfx').currentTime = 0;
        document.getElementById('click-sfx').play().catch(()=>{});
        update();
    }

    function buy(type) {
        if(vitality >= costs[type]) {
            vitality -= costs[type];
            if(type === 'click') { clickPower += 2; costs.click *= 1.8; }
            else if(type === 'passive') { passivePower += 1; costs.passive *= 2; }
            else { passivePower += 25; costs.auto *= 2.5; }
            update();
        }
    }

    function update() {
        document.getElementById('v-count').innerText = Math.floor(vitality).toLocaleString();
        document.getElementById('vps').innerText = passivePower;
        document.getElementById('age-num').innerText = Math.floor(vitality/100);
        document.getElementById('c-cost').innerText = Math.floor(costs.click);
        document.getElementById('p-cost').innerText = Math.floor(costs.passive);
        document.getElementById('a-cost').innerText = Math.floor(costs.auto);

        if(vitality >= 1000) document.getElementById('upg-auto').classList.add('unlocked');

        for(let i=characterData.length-1; i>=0; i--) {
            if(vitality >= characterData[i].goal) { currentStage = i; break; }
        }

        let tracker = document.getElementById('evo-text');
        if(currentStage < characterData.length - 1) {
            let needed = characterData[currentStage + 1].goal - Math.floor(vitality);
            document.getElementById('clicks-left').innerText = Math.ceil(needed / clickPower);
        } else {
            tracker.innerText = "MAX FORM";
        }

        const artDiv = document.getElementById('turtle-art');
        const char = characterData[currentStage];
        artDiv.innerHTML = (char.type === 'img') ? `<img src="${char.art}" style="width:100%; height:100%; object-fit:contain;">` : char.art;
        document.getElementById('stage-name').innerText = char.name;
    }

    function goTo(scr) {
        document.getElementById('home-menu').style.transform = (scr === 'game' || scr === 'owner') ? 'translateX(-100%)' : 'translateX(0)';
        document.getElementById('owner-tab').style.right = (scr === 'owner') ? '0' : '-100%';
        if(scr === 'game') document.getElementById('bg-music').play().catch(()=>{});
    }

    function music(act) {
        const m = document.getElementById('bg-music');
        act === 'play' ? m.play() : m.pause();
    }

    function toggleCodes() {
        const b = document.getElementById('code-box');
        b.style.display = b.style.display === 'none' ? 'block' : 'none';
    }

    function checkCode() {
        if(document.getElementById('code-in').value.toUpperCase() === "OWNER123") {
            document.getElementById('admin-entry').style.display = 'block';
            toggleCodes();
        }
    }

    setInterval(() => { if(passivePower > 0) { vitality += (passivePower / 10); update(); } }, 100);
    update();
</script>
</body>
</html>
