<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TurtleClicker</title>
    <link rel="icon" type="image/png" href="Untitled.png">
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark-green: #064e3b; --mid-green: #14532d; --bright-green: #22c55e;
            --lime: #a3e635; --white: #f8fafc; --gold: #facc15; --ruby: #e11d48;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Luckiest Guy', cursive; background-color: var(--dark-green);
            color: var(--white); overflow: hidden; touch-action: manipulation;
            user-select: none;
        }

        /* --- DYNAMIC BACKGROUND --- */
        #bg-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, #064e3b, #022c22);
            z-index: -1;
        }

        .bubble {
            position: absolute; background: rgba(255, 255, 255, 0.1);
            border-radius: 50%; pointer-events: none;
            animation: rise linear infinite;
        }

        @keyframes rise {
            from { transform: translateY(110vh); }
            to { transform: translateY(-20vh); }
        }

        /* --- LAYOUT --- */
        #game-container {
            display: flex; flex-direction: column; width: 100vw; height: 100vh;
        }

        .top-bar {
            height: 12%; background: rgba(0,0,0,0.4); backdrop-filter: blur(5px);
            display: flex; justify-content: space-around; align-items: center;
            border-bottom: 3px solid var(--mid-green); z-index: 100;
        }

        .hero-section {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; position: relative;
        }

        .shop-drawer {
            height: 38%; background: rgba(0,0,0,0.8);
            border-top: 5px solid var(--bright-green);
            display: flex; flex-direction: column; padding: 15px;
            overflow-y: auto; border-radius: 25px 25px 0 0;
        }

        /* --- THE TURTLE / EGG --- */
        #turtle-anchor {
            width: 320px; height: 320px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            position: relative; transition: transform 0.1s;
        }

        #turtle-anchor:active { transform: scale(0.9); }

        .egg-glow {
            position: absolute; width: 100%; height: 100%;
            background: radial-gradient(circle, var(--lime) 0%, transparent 70%);
            opacity: 0.2; animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.2; }
            50% { transform: scale(1.2); opacity: 0.4; }
        }

        /* --- INTERACTIVE BUTTONS --- */
        .green-btn {
            padding: 10px 20px; font-size: 16px; font-family: 'Luckiest Guy';
            background: var(--bright-green); color: white;
            border: 3px solid var(--white); border-radius: 20px;
            box-shadow: 0 4px 0 var(--dark-green); cursor: pointer;
        }
        .green-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--dark-green); }

        .shop-card {
            display: none; background: #065f46; padding: 15px;
            margin-bottom: 10px; border-radius: 20px; border: 2px solid var(--lime);
            justify-content: space-between; align-items: center;
        }
        .shop-card.visible { display: flex; }

        .particle {
            position: absolute; pointer-events: none; color: var(--lime);
            font-size: 35px; text-shadow: 2px 2px 0 #000;
            animation: fly-out 0.8s ease-out forwards; z-index: 200;
        }

        @keyframes fly-out {
            to { transform: translateY(-150px) rotate(20deg); opacity: 0; }
        }

        #menu-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 44, 34, 0.95); z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

<audio id="bg-music" src="music.mp3" loop></audio>
<audio id="click-sfx" src="click.mp3"></audio>

<div id="menu-overlay">
    <h1 style="font-size: 60px; color: var(--lime); text-shadow: 4px 4px 0 #000;">TurtleClicker</h1>
    <button class="green-btn" style="font-size: 30px; padding: 15px 50px;" onclick="startGame()">START</button>
</div>

<div id="game-container">
    <div id="bg-canvas"></div>

    <div class="top-bar">
        <div>V/SEC: <span id="vps-text" style="color:var(--lime)">0</span></div>
        <div>AGE: <span id="age-text" style="color:var(--gold)">0</span></div>
        <button class="green-btn" style="padding: 5px 15px;" onclick="location.reload()">RELOAD</button>
    </div>

    <div class="hero-section">
        <div style="font-size: 55px; color: var(--white); text-shadow: 4px 4px 0 #000;" id="vitality-text">0</div>
        <div id="evo-hint" style="color:var(--lime); margin-bottom: 10px;">Next Evo: <span id="clicks-rem">50</span></div>

        <div id="turtle-anchor" onclick="clickTurtle(event)">
            <div class="egg-glow"></div>
            <div id="turtle-view" style="width:100%; height:100%; z-index:5;"></div>
        </div>
        
        <div id="stage-label" style="font-size: 24px; color: var(--lime); margin-top: 10px;">Egg</div>
        
        <div style="margin-top: 20px; display: flex; gap: 15px;">
            <button class="green-btn" style="background:#059669" onclick="musicCtrl('play')">▶ PLAY</button>
            <button class="green-btn" style="background:#059669" onclick="musicCtrl('pause')">⏸ PAUSE</button>
        </div>
    </div>

    <div class="shop-drawer">
        <h2 style="margin: 0 0 15px 0; color: var(--gold); text-align: center;">SHOP & FOOD</h2>
        
        <div class="shop-card visible" onclick="buyItem('lettuce')">
            <div><span style="font-size:20px;">🥬 Lettuce</span><br><small>+1 Click Power</small></div>
            <div class="green-btn">$<span id="price-lettuce">10</span></div>
        </div>

        <div class="shop-card visible" onclick="buyItem('uv')">
            <div><span style="font-size:20px;">💡 UV Lamp</span><br><small>+2 Vitality/Sec</small></div>
            <div class="green-btn">$<span id="price-uv">100</span></div>
        </div>

        <div id="item-berry" class="shop-card" onclick="buyItem('berry')">
            <div><span style="font-size:20px;">🍓 Dragon Fruit</span><br><small>+15 Click Power</small></div>
            <div class="green-btn">$<span id="price-berry">1000</span></div>
        </div>

        <div id="item-apple" class="shop-card" onclick="buyItem('apple')">
            <div><span style="font-size:20px;">🍎 Golden Apple</span><br><small>+100 Click Power</small></div>
            <div class="green-btn">$<span id="price-apple">8000</span></div>
        </div>

        <div id="item-friend" class="shop-card" onclick="buyItem('friend')">
            <div><span style="font-size:20px;">🐢 Best Friend</span><br><small>+150 Vitality/Sec</small></div>
            <div class="green-btn">$<span id="price-friend">15000</span></div>
        </div>
    </div>
</div>

<script>
    let g = {
        vitality: 0, clickP: 1, vps: 0, stage: 0,
        prices: { lettuce: 10, uv: 100, berry: 1000, apple: 8000, friend: 15000 }
    };

    const evos = [
        { name: "Egg", goal: 0, type: 'svg', content: `<svg viewBox="0 0 100 100"><ellipse cx="50" cy="50" rx="35" ry="45" fill="#fefce8" stroke="#ccc" stroke-width="2"/></svg>` },
        { name: "Hatchling", goal: 50, type: 'img', content: `Untitled.png` },
        { name: "Shell Guard", goal: 5000, type: 'svg', content: `<svg viewBox="0 0 100 100"><path d="M15 65 Q50 10 85 65" fill="#14532d" stroke="#a3e635" stroke-width="4"/><circle cx="88" cy="60" r="14" fill="#166534" stroke="#a3e635" stroke-width="2"/></svg>` },
        { name: "Ocean Titan", goal: 50000, type: 'svg', content: `<svg viewBox="0 0 100 100"><path d="M5 70 Q50 -20 95 70 Z" fill="#064e3b" stroke="#fbbf24" stroke-width="5"/><circle cx="95" cy="65" r="18" fill="#064e3b" stroke="#fbbf24" stroke-width="3"/></svg>` }
    ];

    function createBubbles() {
        const bg = document.getElementById('bg-canvas');
        for(let i=0; i<15; i++) {
            let b = document.createElement('div'); b.className = 'bubble';
            let size = Math.random()*40 + 10;
            b.style.width = b.style.height = size + 'px';
            b.style.left = Math.random()*100 + 'vw';
            b.style.animationDuration = (Math.random()*5 + 5) + 's';
            b.style.animationDelay = Math.random()*5 + 's';
            bg.appendChild(b);
        }
    }

    function clickTurtle(e) {
        g.vitality += g.clickP;
        let p = document.createElement('div');
        p.className = 'particle'; p.innerText = "+" + g.clickP;
        p.style.left = (e.clientX || e.touches[0].clientX) + 'px';
        p.style.top = (e.clientY || e.touches[0].clientY) + 'px';
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 700);
        document.getElementById('click-sfx').currentTime = 0;
        document.getElementById('click-sfx').play().catch(()=>{});
        updateUI();
    }

    function buyItem(id) {
        if(g.vitality >= g.prices[id]) {
            g.vitality -= g.prices[id];
            if(id === 'lettuce') { g.clickP += 1; g.prices.lettuce *= 1.6; }
            else if(id === 'uv') { g.vps += 2; g.prices.uv *= 1.8; }
            else if(id === 'berry') { g.clickP += 15; g.prices.berry *= 2; }
            else if(id === 'apple') { g.clickP += 100; g.prices.apple *= 2.2; }
            else if(id === 'friend') { g.vps += 150; g.prices.friend *= 2.5; }
            updateUI();
        }
    }

    function updateUI() {
        document.getElementById('vitality-text').innerText = Math.floor(g.vitality).toLocaleString();
        document.getElementById('vps-text').innerText = g.vps;
        document.getElementById('age-text').innerText = Math.floor(g.vitality/100);
        
        for(let key in g.prices) {
            let el = document.getElementById('price-' + key);
            if(el) el.innerText = Math.floor(g.prices[key]).toLocaleString();
        }

        if(g.vitality >= 800) document.getElementById('item-berry').classList.add('visible');
        if(g.vitality >= 5000) document.getElementById('item-apple').classList.add('visible');
        if(g.vitality >= 10000) document.getElementById('item-friend').classList.add('visible');

        let next = 0;
        for(let i=evos.length-1; i>=0; i--) { if(g.vitality >= evos[i].goal) { next = i; break; } }

        if(next !== g.stage) {
            g.stage = next;
            let view = document.getElementById('turtle-view');
            view.innerHTML = (evos[g.stage].type === 'img') ? `<img src="${evos[g.stage].content}" style="width:100%;height:100%;object-fit:contain;">` : evos[g.stage].content;
            document.getElementById('stage-label').innerText = evos[g.stage].name;
        }

        let hint = document.getElementById('evo-hint');
        if(g.stage < evos.length - 1) {
            let diff = evos[g.stage+1].goal - Math.floor(g.vitality);
            document.getElementById('clicks-rem').innerText = Math.ceil(diff/g.clickP);
        } else { hint.innerText = "MAX FORM REACHED"; }
    }

    function startGame() {
        document.getElementById('menu-overlay').style.display = 'none';
        document.getElementById('bg-music').play().catch(()=>{});
        updateUI(); // Force initial egg render
    }

    function musicCtrl(a) { let m = document.getElementById('bg-music'); a === 'play' ? m.play() : m.pause(); }

    createBubbles();
    setInterval(() => { if(g.vps > 0) { g.vitality += (g.vps / 10); updateUI(); } }, 100);
    // Initial UI call to ensure Egg shows up immediately
    updateUI();
</script>
</body>
</html>
